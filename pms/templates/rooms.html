{% extends "main.html"%}
{% block content %}

<h1>Habitaciones del hotel</h1>

<form method="get">
    {{ form.name.label_tag }}
    {{ form.name }}
    <button type="submit">Filtrar</button>
    <a href="/rooms/">Limpiar</a>
</form>

<br>

{% for room in rooms %}
    <p>{{ room.name }} ({{ room.room_type__name }})</p>
{% empty %}
    <p>No se han encontrado habitaciones.</p>
{% endfor %}

{% endblock content %}
